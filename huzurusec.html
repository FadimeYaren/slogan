<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Huzuru Seçiyorum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* Genel ayarlar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      overflow: hidden;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
    }

    /* Arka plandaki yumuşak renkli daireler */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.7;
      mix-blend-mode: screen;
      animation: float 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb:nth-child(1) {
      width: 400px;
      height: 400px;
      background: #38bdf8;
      top: -80px;
      left: -60px;
      animation-duration: 22s;
    }

    .orb:nth-child(2) {
      width: 380px;
      height: 380px;
      background: #a855f7;
      bottom: -120px;
      right: -40px;
      animation-duration: 26s;
    }

    .orb:nth-child(3) {
      width: 320px;
      height: 320px;
      background: #22c55e;
      top: 60%;
      left: -100px;
      animation-duration: 30s;
    }

    @keyframes float {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(60px, -40px, 0) scale(1.1); }
    }

    /* Ortadaki içerik kutusu */
    .center-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 900px;
      text-align: center;
      padding: 40px 32px 36px;
      border-radius: 28px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: radial-gradient(circle at top, rgba(148, 163, 184, 0.18), rgba(15, 23, 42, 0.96));
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.9),
        0 0 40px rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(14px);
    }

    /* Slogan */
    .slogan {
      font-size: clamp(2.4rem, 4vw + 1rem, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f9fafb;
      position: relative;
      display: inline-block;
      padding: 0 0.1em;
      text-shadow:
        0 0 18px rgba(15, 23, 42, 0.8),
        0 0 36px rgba(56, 189, 248, 0.6);
      animation: breathe 6s ease-in-out infinite;
    }

    /* Slogan altındaki ince ışık efekti */
    .slogan::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -18px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.9);
      opacity: 0.8;
      animation: glow 3.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%   { transform: scale(1);   text-shadow: 0 0 18px rgba(56, 189, 248, 0.7); }
      50%  { transform: scale(1.03); text-shadow: 0 0 32px rgba(56, 189, 248, 1); }
      100% { transform: scale(1);   text-shadow: 0 0 18px rgba(56, 189, 248, 0.7); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.3; transform: scaleX(0.9); }
      50%      { opacity: 1;   transform: scaleX(1); }
    }

    /* Alt açıklama metni */
    .subtitle {
      margin-top: 32px;
      font-size: 0.98rem;
      color: #cbd5f5;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .subtitle span {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
    }

    /* Alttaki mini not */
    .tiny-note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
      opacity: 0.7;
    }

    /* Küçük ekranlar için */
    @media (max-width: 480px) {
      .card {
        padding: 28px 18px 24px;
        border-radius: 22px;
      }

      .subtitle {
        font-size: 0.8rem;
      }

      .tiny-note {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <!-- Arka plan orbları -->
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>

  <!-- Ortadaki içerik -->
  <div class="center-wrapper">
    <div class="card">
      <div class="slogan">
        Huzuru seçiyorum,<br />
        kendimi seçiyorum
      </div>

      <div class="subtitle">
        <span>Bugün odak: Sakinlik · Öz-şefkat · İlerleme</span>
      </div>

      <div class="tiny-note">
        Nefes al, omuzlarını gevşet, sadece bir sonraki adımı düşün. 🌿
      </div>
    </div>
  </div>

</body>
</html>

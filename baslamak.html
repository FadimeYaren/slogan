<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Başlamak başarmanın yarısıdır</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      /* ARKA PLAN PNG */
      background-image: url("001bg.png"); /* burayı kendi dosya adına göre değiştir */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      padding: 1.5rem 2rem;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      max-width: 800px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.3;
    }

    /* Sol üstte küçük ev butonu */
    .home-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      text-decoration: none;
      font-size: 1.8rem;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .home-btn:hover {
      background: rgba(0,0,0,0.75);
    }
  </style>
</head>
<body>
  <!-- Sol üstte ev ikonu, index.html'e götürüyor -->
  <a href="index.html" class="home-btn">🏠</a>

  <!-- Ortadaki yazıyı buraya yaz -->
  <div class="overlay">
    Başlamak başarmanın yarısıdır
  </div>
</body>
</html>

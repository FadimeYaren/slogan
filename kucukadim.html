<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Ortada Yazı - Arka Plan PNG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;   /* yatayda ortala */
      align-items: center;       /* dikeyde ortala */
      text-align: center;
      font-family: Arial, sans-serif;
      color: #ffffff;

      /* ARKA PLAN PNG (aynı klasördeki dosya adını yaz) */
      background-image: url("004bg.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .center-text {
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.4); /* yazıyı okunur yapmak için hafif koyu arka plan */
      border-radius: 10px;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <style>
  .center-text {
    text-align: center;
    color: white;
    font-size: 32px; /* yazı boyutu */
    font-weight: 600;
    line-height: 1.4; /* satır aralığı */
  }
</style>

<div class="center-text">
  Yürüsende iki ileri bir geri<br>
  Yürü sen de durmadan ileri
</div>


</body>
</html>

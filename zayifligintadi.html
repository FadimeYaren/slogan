<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Zayıflığın tadı hiçbir yemekte yok</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffe0e6, #1a1a1a);
      color: #ffffff;
    }

    .slogan {
      text-align: center;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1.2;
      max-width: 900px;
      padding: 1rem 2rem;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .highlight {
      color: #ff6b81;
    }
  </style>
</head>
<body>
  <div class="slogan">
    <span class="highlight">Zayıflığın tadı</span> hiçbir yemekte yok
  </div>
</body>
</html>
